appId: com.navidrome.player
productName: Navidrome Player
copyright: Copyright © 2026 Navidrome Player

directories:
  output: release
  buildResources: build

# O renderer é totalmente empacotado pelo Vite e o main usa apenas APIs nativas
# (electron + node builtins), então node_modules não precisa ir junto.
files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - build/icon.ico
  - package.json
  - "!node_modules/**/*"
  - "!scripts/**/*"
  - "!release/**/*"
  - "!README.md"

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Navidrome Player
  uninstallDisplayName: Navidrome Player
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

mac:
  icon: build/icon.png
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
  hardenedRuntime: false

dmg:
  title: ${productName}

linux:
  icon: build/icon.png
  category: Audio
  maintainer: Navidrome Player <player@navidrome.local>
  synopsis: Player desktop para Navidrome (API Subsonic)
  target:
    - target: AppImage
    - target: deb
